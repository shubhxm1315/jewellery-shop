<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }

        .reset-box {
            width: 350px;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .message {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="reset-box">

    <h2>Reset Password</h2>

    <form th:action="@{/reset-password}" method="post">

        <!-- Reset token -->
        <input type="hidden" name="token" th:value="${token}">

        <label>New Password</label>
        <input type="password"
               name="password"
               placeholder="Enter new password"
               required>

        <label>Confirm Password</label>
        <input type="password"
               name="confirmPassword"
               placeholder="Confirm new password"
               required>

        <button type="submit">Reset Password</button>

    </form>

    <p class="message" th:if="${error}" th:text="${error}"></p>

</div>

</body>
</html>
